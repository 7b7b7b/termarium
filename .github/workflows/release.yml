name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_ext: tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Unix artifact
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/termarium" dist/termarium
          tar -C dist -czf "dist/termarium-${{ matrix.target }}.tar.gz" termarium
          shasum -a 256 "dist/termarium-${{ matrix.target }}.tar.gz" > "dist/SHA256SUMS-${{ matrix.target }}"

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/termarium.exe" "dist/termarium.exe"
          Compress-Archive -Path "dist/termarium.exe" -DestinationPath "dist/termarium-${{ matrix.target }}.zip" -Force
          $hash = (Get-FileHash "dist/termarium-${{ matrix.target }}.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  dist/termarium-${{ matrix.target }}.zip" | Out-File -FilePath "dist/SHA256SUMS-${{ matrix.target }}" -Encoding ascii

      - name: Upload artifact archive
        uses: actions/upload-artifact@v4
        with:
          name: termarium-${{ matrix.target }}
          path: dist/termarium-${{ matrix.target }}.${{ matrix.archive_ext }}

      - name: Upload checksum fragment
        uses: actions/upload-artifact@v4
        with:
          name: sha256-${{ matrix.target }}
          path: dist/SHA256SUMS-${{ matrix.target }}

  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: termarium-*
          path: release-assets
          merge-multiple: true

      - name: Download checksum fragments
        uses: actions/download-artifact@v4
        with:
          pattern: sha256-*
          path: checksums
          merge-multiple: true

      - name: Build final checksum file
        shell: bash
        run: cat checksums/SHA256SUMS-* > release-assets/SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/termarium-*.tar.gz
            release-assets/termarium-*.zip
            release-assets/SHA256SUMS

  npm:
    name: Publish npm package
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Check package contents
        run: npm pack --dry-run

      - name: Read package metadata
        id: package
        shell: bash
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches package version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "${{ steps.package.outputs.version }}" != "$tag_version" ]; then
            echo "package.json version ${{ steps.package.outputs.version }} does not match tag $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Check whether npm version exists
        id: npm
        shell: bash
        run: |
          if npm view "${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.npm.outputs.published != 'true'
        run: npm publish --access public
